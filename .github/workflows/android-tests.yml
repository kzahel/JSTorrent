name: Android Tests

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'packages/engine/**'
      - '.github/workflows/android-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'packages/engine/**'
      - '.github/workflows/android-tests.yml'
  workflow_dispatch:
    inputs:
      run_e2e:
        description: 'Run full E2E tests with seeder'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read

defaults:
  run:
    working-directory: android

jobs:
  # Unit tests run on every push/PR (fast, no emulator needed)
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install pnpm
        run: corepack enable pnpm
        working-directory: .

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build engine bundle
        run: pnpm bundle:native
        working-directory: packages/engine

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Show Test Failures
        if: failure()
        run: |
          echo "=== Unit Test Failures ==="
          find . -path "*/test-results/testDebugUnitTest/*.xml" -type f | while read xml_file; do
            if grep -q 'failures="[1-9]' "$xml_file" 2>/dev/null || grep -q '<failure' "$xml_file" 2>/dev/null; then
              echo ""
              echo "--- $xml_file ---"
              grep -o 'classname="[^"]*"' "$xml_file" | head -1 || true
              grep -A 10 '<failure' "$xml_file" | head -50 || true
            fi
          done

      - name: Upload Unit Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: android/app/build/reports/tests/testDebugUnitTest/

  # Instrumented tests require Android emulator
  # Disabled: emulator startup unreliable on CI (frequent timeouts). Run locally with:
  #   source android/scripts/android-env.sh && emu start
  #   ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.notPackage=com.jstorrent.app.companion,com.jstorrent.app.e2e
  instrumented-tests:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        api-level: [30] # Android 11 - good balance of features and stability

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install pnpm
        run: corepack enable pnpm
        working-directory: .

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build engine bundle
        run: pnpm bundle:native
        working-directory: packages/engine

      - name: Build Debug APK and Test APK
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      - name: Free disk space for AVD
        run: |
          # Remove unnecessary large packages to free space for AVD (~7.4GB needed)
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /usr/local/lib/android/sdk/cmake
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /opt/hostedtoolcache/go
          sudo rm -rf /opt/hostedtoolcache/node
          df -h

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD Cache
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}-x86_64

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "Generated AVD snapshot for caching."

      - name: Run Instrumented Tests (excluding E2E)
        id: instrumented-tests
        uses: reactivecircus/android-emulator-runner@v2
        # The emulator action has a bug where cleanup can fail with "operation was canceled"
        # even when tests pass. We capture the test result and check it in the next step.
        continue-on-error: true
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          disable-animations: true
          working-directory: android
          script: |
            # Run all instrumented tests EXCEPT:
            # - E2E tests (need external seeder)
            # - Companion tests (java-websocket server startup timing unreliable on CI emulators)
            ./gradlew connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.notPackage=com.jstorrent.app.companion,com.jstorrent.app.e2e
            TEST_RESULT=$?
            # Kill emulator and adb server before action cleanup to avoid "stop: Not implemented" error
            adb emu kill 2>/dev/null || true
            sleep 2
            adb kill-server 2>/dev/null || true
            sleep 1
            exit $TEST_RESULT

      - name: Check Test Results
        if: always()
        run: |
          # Check if the test XML results indicate failure
          # Note: XML files are in device subdirectories like connected/emulator-5554/
          FAILED=0
          for xml_file in $(find . -path "*/androidTest-results/connected/*" -name "*.xml" -type f 2>/dev/null); do
            if grep -q 'failures="[1-9]' "$xml_file" 2>/dev/null || grep -q 'errors="[1-9]' "$xml_file" 2>/dev/null; then
              FAILED=1
              break
            fi
          done
          if [ $FAILED -eq 1 ]; then
            echo "Tests failed - check artifacts for details"
            exit 1
          fi
          # If no test results found and emulator step had issues, something went wrong
          if [ -z "$(find . -path "*/androidTest-results/connected/*" -name "*.xml" -type f 2>/dev/null)" ]; then
            echo "No test results found - emulator may have crashed before tests ran"
            exit 1
          fi
          echo "Tests passed!"

      - name: Show Test Failures
        if: failure()
        run: |
          echo "=== Test Failures ==="
          # Find all XML result files and extract failures
          find . -path "*/androidTest-results/connected/*" -name "*.xml" -type f | while read xml_file; do
            # Extract test failures using grep/sed
            if grep -q 'failures="[1-9]' "$xml_file" 2>/dev/null || grep -q '<failure' "$xml_file" 2>/dev/null; then
              echo ""
              echo "--- $xml_file ---"
              # Show the test class name
              grep -o 'classname="[^"]*"' "$xml_file" | head -1 || true
              # Extract and display failure messages
              grep -A 5 '<failure' "$xml_file" | head -50 || true
            fi
          done
          echo ""
          echo "Full reports available as artifacts"

      - name: Upload Instrumented Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-results-api${{ matrix.api-level }}
          path: |
            android/app/build/reports/androidTests/connected/
            android/app/build/outputs/androidTest-results/

  # E2E tests with external seeder (DownloadE2ETest)
  # Disabled: emulator networking unreliable on CI. Run locally with:
  #   pnpm seed-for-test &
  #   ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.jstorrent.app.e2e.DownloadE2ETest
  e2e-tests:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        api-level: [30]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install pnpm
        run: corepack enable pnpm
        working-directory: .

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Setup uv
        uses: astral-sh/setup-uv@v9
        with:
          version: '0.9.18'
          enable-cache: true

      - name: Install seeder dependencies
        run: uv sync --locked
        working-directory: packages/engine/integration/python

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build engine bundle
        run: pnpm bundle:native
        working-directory: packages/engine

      - name: Build Debug APK and Test APK
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      - name: Free disk space for AVD
        run: |
          # Remove unnecessary large packages to free space for AVD (~7.4GB needed)
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /usr/local/lib/android/sdk/cmake
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /opt/hostedtoolcache/go
          sudo rm -rf /opt/hostedtoolcache/node
          # Show available space
          df -h

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD Cache
        uses: actions/cache@v6
        id: avd-cache-e2e
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-e2e-${{ matrix.api-level }}-x86_64

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache-e2e.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "Generated AVD snapshot for caching."

      - name: Run E2E Tests with Seeder
        id: e2e-tests
        uses: reactivecircus/android-emulator-runner@v2
        # The emulator action has a bug where cleanup can fail with "operation was canceled"
        # even when tests pass. We capture the test result and check it in the next step.
        continue-on-error: true
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          disable-animations: true
          working-directory: android
          script: |
            # Start the Python seeder in background
            (cd ../packages/engine/integration/python && uv run python seed_for_test.py --size 100mb --quiet) &
            SEEDER_PID=$!
            sleep 5
            # Run tests
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.jstorrent.app.e2e.DownloadE2ETest
            TEST_RESULT=$?
            # Kill the seeder and wait for cleanup
            kill $SEEDER_PID 2>/dev/null || true
            wait $SEEDER_PID 2>/dev/null || true
            # Kill emulator and adb server before action cleanup to avoid "stop: Not implemented" error
            adb emu kill 2>/dev/null || true
            sleep 2
            adb kill-server 2>/dev/null || true
            sleep 1
            exit $TEST_RESULT

      - name: Check Test Results
        if: always()
        run: |
          # Check if the test XML results indicate failure
          # Note: XML files are in device subdirectories like connected/emulator-5554/
          FAILED=0
          for xml_file in $(find . -path "*/androidTest-results/connected/*" -name "*.xml" -type f 2>/dev/null); do
            if grep -q 'failures="[1-9]' "$xml_file" 2>/dev/null || grep -q 'errors="[1-9]' "$xml_file" 2>/dev/null; then
              FAILED=1
              break
            fi
          done
          if [ $FAILED -eq 1 ]; then
            echo "Tests failed - check artifacts for details"
            exit 1
          fi
          # If no test results found, something went wrong
          if [ -z "$(find . -path "*/androidTest-results/connected/*" -name "*.xml" -type f 2>/dev/null)" ]; then
            echo "No test results found - emulator may have crashed before tests ran"
            exit 1
          fi
          echo "Tests passed!"

      - name: Show Test Failures
        if: failure()
        run: |
          echo "=== E2E Test Failures ==="
          find . -path "*/androidTest-results/connected/*" -name "*.xml" -type f | while read xml_file; do
            if grep -q 'failures="[1-9]' "$xml_file" 2>/dev/null || grep -q '<failure' "$xml_file" 2>/dev/null; then
              echo ""
              echo "--- $xml_file ---"
              grep -o 'classname="[^"]*"' "$xml_file" | head -1 || true
              grep -A 5 '<failure' "$xml_file" | head -50 || true
            fi
          done
          echo ""
          echo "Full reports available as artifacts"

      - name: Upload E2E Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results-api${{ matrix.api-level }}
          path: |
            android/app/build/reports/androidTests/connected/
            android/app/build/outputs/androidTest-results/
