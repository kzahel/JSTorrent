name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
    tags:
      - 'website-v*'
    paths:
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install

      - name: Fetch latest tauri-app release
        id: tauri-release
        run: |
          TAG=$(gh release list --json tagName -q '[.[] | select(.tagName | startswith("tauri-app-v"))][0].tagName // empty')
          if [ -n "$TAG" ]; then
            echo "tag=${TAG#tauri-app-}" >> $GITHUB_OUTPUT
            echo "Found latest tauri-app release: $TAG"
          else
            echo "tag=v0.1.31" >> $GITHUB_OUTPUT
            echo "No tauri-app release found, using fallback"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build workspace dependencies
        run: pnpm --filter @jstorrent/plugin-sdk build

      - name: Build Website
        run: |
          cd website
          pnpm run build
        env:
          TAURI_APP_TAG: ${{ steps.tauri-release.outputs.tag }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'website/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
