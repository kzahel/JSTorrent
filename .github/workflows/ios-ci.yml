name: iOS CI

on:
  push:
    branches: [main]
    tags:
      - 'ios-v*'
    paths:
      - 'ios/**'
      - 'packages/engine/**'
      - '.github/workflows/ios-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ios/**'
      - 'packages/engine/**'
      - '.github/workflows/ios-ci.yml'

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build engine bundle
        run: pnpm -C packages/engine bundle:native

      - name: Sync engine bundle to iOS
        run: ios/scripts/sync-engine-bundle.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build for simulator
        working-directory: ios
        run: |
          xcodebuild \
            -project JSTorrent.xcodeproj \
            -scheme JSTorrent \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run JSTorrentKit tests
        run: swift test --package-path ios/JSTorrentKit

      - name: Run app tests
        working-directory: ios
        run: |
          xcodebuild \
            -project JSTorrent.xcodeproj \
            -scheme JSTorrent \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            test

  release-ios:
    runs-on: macos-15
    if: startsWith(github.ref, 'refs/tags/ios-v')
    env:
      HAS_IOS_SIGNING: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build engine bundle
        run: pnpm -C packages/engine bundle:native

      - name: Sync engine bundle to iOS
        run: ios/scripts/sync-engine-bundle.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      # --- iOS code signing ---
      - name: Set up iOS code signing keychain
        if: env.HAS_IOS_SIGNING == 'true'
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          echo "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          echo "Available signing identities:"
          security find-identity -v -p codesigning build.keychain
          rm -f certificate.p12

      - name: Install provisioning profile
        if: env.HAS_IOS_SIGNING == 'true'
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/jstorrent_ios.mobileprovision

      - name: Set up ASC API key
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          KEY_PATH="$HOME/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          echo "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      # --- Archive and export ---
      - name: Archive
        working-directory: ios
        run: |
          xcodebuild \
            -project JSTorrent.xcodeproj \
            -scheme JSTorrent \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -archivePath build/JSTorrent.xcarchive \
            DEVELOPMENT_TEAM=VD7BYQ6ABM \
            archive

      - name: Export IPA
        working-directory: ios
        run: |
          xcodebuild -exportArchive \
            -archivePath build/JSTorrent.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export

      # --- Upload to App Store Connect for notarization ---
      - name: Upload to App Store Connect
        working-directory: ios
        run: |
          set +e
          xcrun altool --upload-app \
            --type ios \
            --file build/export/JSTorrent.ipa \
            --apiKey "${{ secrets.ASC_API_KEY_ID }}" \
            --apiIssuer "${{ secrets.ASC_API_ISSUER_ID }}" 2>&1 | tee /tmp/upload-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if [ $EXIT_CODE -ne 0 ]; then
            if grep -q "ENTITY_ERROR.ATTRIBUTE.INVALID.DUPLICATE" /tmp/upload-output.txt; then
              echo "Build already uploaded — continuing"
            else
              exit $EXIT_CODE
            fi
          fi

      # --- Submit for notarization and fetch ADP ---
      - name: Install Python dependencies
        run: python3 -m pip install --break-system-packages PyJWT cryptography

      - name: Submit for notarization and fetch ADP
        id: adp
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          VERSION="${GITHUB_REF_NAME#ios-v}"
          BUILD_NUMBER=$(grep "CURRENT_PROJECT_VERSION" ios/project.yml | grep -o "[0-9]*")
          python3 ios/scripts/fetch-adp.py \
            --key-path "$APPLE_API_KEY_PATH" \
            --key-id "$ASC_API_KEY_ID" \
            --issuer-id "$ASC_API_ISSUER_ID" \
            --bundle-id com.jstorrent.ios \
            --version "$VERSION" \
            --min-build-number "$BUILD_NUMBER" \
            --output-dir ios/build/adp

      # --- Extract changelog ---
      - name: Extract changelog
        id: changelog
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#ios-v}"
          NOTES=$(awk "/^## \\[$VERSION\\]/{found=1; next} /^## \\[/{found=0} found" ios/CHANGELOG.md)
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      # --- Create GitHub Release with IPA and ADP ---
      - name: Create release with ADP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#ios-v}"
          TAG="${GITHUB_REF_NAME}"

          cat > /tmp/release-body.md << BODY_EOF
          ${{ steps.changelog.outputs.notes }}

          ## AltStore PAL

          Add JSTorrent to AltStore PAL:
          \`\`\`
          altstore://source?url=https://jstorrent.com/altstore-source.json
          \`\`\`
          BODY_EOF

          ASSETS=(ios/build/export/JSTorrent.ipa)
          if [ -d ios/build/adp ]; then
            tar -czf ios/build/adp.tar.gz -C ios/build adp
            ASSETS+=(ios/build/adp.tar.gz)
          fi

          gh release create "$TAG" \
            --title "JSTorrent iOS v${VERSION}" \
            --notes-file /tmp/release-body.md \
            --draft \
            "${ASSETS[@]}"

      # --- Generate and commit AltStore source JSON ---
      - name: Generate AltStore source JSON
        run: |
          VERSION="${GITHUB_REF_NAME#ios-v}"
          TAG="${GITHUB_REF_NAME}"
          ADP_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/adp.tar.gz"
          ./scripts/ios-finalize-release.sh "$VERSION" "$ADP_URL"

      - name: Commit AltStore source JSON
        run: |
          VERSION="${GITHUB_REF_NAME#ios-v}"
          OUTPUT="website/public/altstore-source.json"
          if [ -f "$OUTPUT" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git fetch origin main
            git checkout main
            git add "$OUTPUT"
            git commit -m "Update AltStore source for iOS v${VERSION}" || echo "No changes to commit"
            git push origin main
          fi

      - name: Undraft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release edit "$TAG" --draft=false

      # --- Cleanup ---
      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain build.keychain 2>/dev/null || true
          rm -rf ~/private_keys 2>/dev/null || true
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/jstorrent_ios.mobileprovision 2>/dev/null || true
