name: Tauri App CI

on:
  push:
    branches: [main]
    tags:
      - 'tauri-app-v*'
    paths:
      - 'desktop/**'
      - 'packages/**'
      - '.github/workflows/tauri-app-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'packages/**'
      - '.github/workflows/tauri-app-ci.yml'

permissions:
  contents: read

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build each macOS architecture natively on the supported macOS 26
          # images. `platform: macos-latest` remains the discriminator used by
          # conditional steps; `runner` selects the runner architecture.
          - platform: macos-latest
            runner: macos-26
            args: '--target aarch64-apple-darwin'
            rust_target: aarch64-apple-darwin
          - platform: macos-latest
            runner: macos-26-intel
            args: '--target x86_64-apple-darwin'
            rust_target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
            rust_target: ''
          - platform: ubuntu-22.04-arm
            args: ''
            rust_target: ''
          - platform: windows-latest
            args: ''
            rust_target: ''

    runs-on: ${{ matrix.runner || matrix.platform }}

    env:
      HAS_MACOS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' }}
      HAS_MACOS_NOTARIZATION: ${{ secrets.ASC_API_KEY_P8_BASE64 != '' }}
      HAS_WINDOWS_SIGNING: ${{ secrets.AZURE_CLIENT_SECRET != '' }}

    steps:
      - uses: actions/checkout@v7

      # --- Node.js + pnpm ---
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      # --- Rust ---
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './desktop -> target'

      # --- Linux system dependencies ---
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev xdg-utils

      # --- macOS code signing ---
      - name: Set up macOS code signing keychain
        if: matrix.platform == 'macos-latest' && env.HAS_MACOS_SIGNING == 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > certificate.p12
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$MACOS_KEYCHAIN_PASSWORD" build.keychain
          echo "Available signing identities:"
          security find-identity -v -p codesigning build.keychain
          rm -f certificate.p12

      - name: Set up macOS notarization credentials
        if: matrix.platform == 'macos-latest' && env.HAS_MACOS_NOTARIZATION == 'true'
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          KEY_PATH="$HOME/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          echo "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      # --- Windows signing tool ---
      - name: Install trusted-signing-cli
        if: matrix.platform == 'windows-latest' && env.HAS_WINDOWS_SIGNING == 'true'
        run: cargo install trusted-signing-cli

      # --- Build sidecars ---
      - name: Build sidecars
        shell: bash
        working-directory: desktop
        run: |
          if [ -n "${{ matrix.rust_target }}" ]; then
            TARGET="${{ matrix.rust_target }}"
            cargo build --release -p jstorrent-host --target "$TARGET"
            cargo build --release -p jstorrent-io-daemon --target "$TARGET"
            mkdir -p tauri-app/src-tauri/binaries
            if [[ "$TARGET" == *"windows"* ]]; then
              cp "target/$TARGET/release/jstorrent-host.exe" "tauri-app/src-tauri/binaries/jstorrent-host-$TARGET.exe"
              cp "target/$TARGET/release/jstorrent-io-daemon.exe" "tauri-app/src-tauri/binaries/jstorrent-io-daemon-$TARGET.exe"
            else
              cp "target/$TARGET/release/jstorrent-host" "tauri-app/src-tauri/binaries/jstorrent-host-$TARGET"
              cp "target/$TARGET/release/jstorrent-io-daemon" "tauri-app/src-tauri/binaries/jstorrent-io-daemon-$TARGET"
            fi
          else
            TRIPLE="$(rustc --print host-tuple)"
            cargo build --release -p jstorrent-host
            cargo build --release -p jstorrent-io-daemon
            mkdir -p tauri-app/src-tauri/binaries
            if [ "${{ matrix.platform }}" = "windows-latest" ]; then
              cp "target/release/jstorrent-host.exe" "tauri-app/src-tauri/binaries/jstorrent-host-$TRIPLE.exe"
              cp "target/release/jstorrent-io-daemon.exe" "tauri-app/src-tauri/binaries/jstorrent-io-daemon-$TRIPLE.exe"
            else
              cp "target/release/jstorrent-host" "tauri-app/src-tauri/binaries/jstorrent-host-$TRIPLE"
              cp "target/release/jstorrent-io-daemon" "tauri-app/src-tauri/binaries/jstorrent-io-daemon-$TRIPLE"
            fi
          fi

      # --- Run Rust tests ---
      - name: Run Rust tests
        shell: bash
        working-directory: desktop
        run: |
          # When cross-compiling (host != target), the Build sidecars step only
          # builds for the target triple. We need real binaries for the host triple
          # so that integration tests (native_messaging) can spawn io-daemon, and
          # sidecar stubs for the tauri build script validation.
          TRIPLE="$(rustc --print host-tuple)"
          TARGET="${{ matrix.rust_target }}"
          if [ -n "$TARGET" ] && [ "$TARGET" != "$TRIPLE" ]; then
            cargo build -p jstorrent-host -p jstorrent-io-daemon
            for bin in jstorrent-host jstorrent-io-daemon; do
              stub="tauri-app/src-tauri/binaries/${bin}-${TRIPLE}"
              [ -f "$stub" ] || cp "target/debug/${bin}" "$stub"
            done
          else
            for bin in jstorrent-host jstorrent-io-daemon; do
              stub="tauri-app/src-tauri/binaries/${bin}-${TRIPLE}"
              [ -f "$stub" ] || [ -f "${stub}.exe" ] || touch "$stub"
            done
          fi
          cargo test --workspace

      - name: Check Rust formatting and lints
        if: matrix.platform == 'ubuntu-22.04'
        working-directory: desktop
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Audit Rust dependencies
        if: matrix.platform == 'ubuntu-22.04'
        working-directory: desktop
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit

      # --- Verify auto-updater entry point ---
      - name: Verify auto-updater entry point
        shell: bash
        run: |
          grep -q "initUpdater()" desktop/tauri-app/src/main.tsx || {
            echo "::error::initUpdater() not found in main.tsx — auto-updates will be disabled!"
            exit 1
          }
          grep -q "from './updater'" desktop/tauri-app/src/main.tsx || {
            echo "::error::updater module import missing from main.tsx!"
            exit 1
          }

      # --- Install frontend dependencies ---
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugin-sdk
        run: pnpm build
        working-directory: packages/plugin-sdk

      # --- Extract changelog ---
      - name: Extract changelog
        id: changelog
        if: startsWith(github.ref, 'refs/tags/tauri-app-v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#tauri-app-v}"
          NOTES=$(awk "/^## \\[$VERSION\\]/{found=1; next} /^## \\[/{found=0} found" desktop/tauri-app/CHANGELOG.md)
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      # --- Build Tauri app ---
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          # linuxdeploy is an AppImage that needs FUSE; CI runners may lack it
          APPIMAGE_EXTRACT_AND_RUN: '1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code signing (Tauri reads these automatically)
          APPLE_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: "${{ matrix.platform == 'macos-latest' && 'Developer ID Application: Kyle Graehl (VD7BYQ6ABM)' || '' }}"
          # macOS notarization
          APPLE_API_KEY: ${{ secrets.ASC_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.ASC_API_ISSUER_ID }}
          # APPLE_API_KEY_PATH is set via GITHUB_ENV in the notarization setup step
          # Windows signing (for trusted-signing-cli)
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        with:
          projectPath: desktop/tauri-app
          tauriScript: pnpm tauri
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && 'tauri-app-v__VERSION__' || '' }}
          releaseName: 'JSTorrent Desktop v__VERSION__'
          releaseBody: ${{ steps.changelog.outputs.notes || 'See the assets to download and install this version.' }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: ${{ startsWith(github.ref, 'refs/tags/') }}
          updaterJsonKeepUniversal: true
          args: >-
            ${{ matrix.args }}
            ${{ matrix.platform == 'windows-latest' && secrets.AZURE_CLIENT_SECRET != '' && '--config ''{"bundle":{"windows":{"signCommand":"trusted-signing-cli -e https://eus.codesigning.azure.net -a kylegraehl -c jstorrent-profile %1"}}}''' || '' }}

      # --- Upload standalone io-daemon binary (Crostini / ChromeOS Flex) ---
      - name: Upload standalone io-daemon binary
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/tauri-app-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#tauri-app-v}"
          TRIPLE="$(rustc --print host-tuple)"
          ASSET_NAME="jstorrent-io-daemon-${TRIPLE}"
          cp "desktop/target/release/jstorrent-io-daemon" "${ASSET_NAME}"
          chmod +x "${ASSET_NAME}"
          gh release upload "tauri-app-v${VERSION}" "${ASSET_NAME}" --clobber

      # --- Diagnose flaky DMG bundling ---
      - name: Check for flaky DMG bundling failure
        if: failure() && matrix.platform == 'macos-latest'
        run: |
          # The macOS hdiutil/bundle_dmg.sh step is known to fail intermittently
          # on GitHub Actions runners due to resource contention.
          # See: https://github.com/actions/runner-images/issues/7522
          echo ""
          echo "::error::macOS DMG bundling failed. This is likely the known flaky hdiutil issue on GitHub Actions runners (not a code problem). Re-run this job: gh run rerun ${{ github.run_id }} --failed"
          echo ""
          echo "If this keeps failing, consider using '--bundles app,updater' to skip DMG creation for this target."

      # --- macOS .pkg installer ---
      - name: Build .pkg installer
        if: matrix.platform == 'macos-latest' && startsWith(github.ref, 'refs/tags/tauri-app-v')
        env:
          INSTALLER_IDENTITY: 'Developer ID Installer: Kyle Graehl (VD7BYQ6ABM)'
        run: |
          VERSION="${GITHUB_REF_NAME#tauri-app-v}"
          TARGET="${{ matrix.rust_target }}"
          ARCH=$([[ "$TARGET" = "aarch64-apple-darwin" ]] && echo "aarch64" || echo "x64")
          APP_PATH="desktop/target/$TARGET/release/bundle/macos/JSTorrent.app"
          bash desktop/tauri-app/scripts/build-macos-pkg.sh "$APP_PATH" "$VERSION" "$ARCH"

      - name: Notarize .pkg installer
        if: matrix.platform == 'macos-latest' && startsWith(github.ref, 'refs/tags/tauri-app-v') && env.HAS_MACOS_NOTARIZATION == 'true'
        run: |
          VERSION="${GITHUB_REF_NAME#tauri-app-v}"
          TARGET="${{ matrix.rust_target }}"
          ARCH=$([[ "$TARGET" = "aarch64-apple-darwin" ]] && echo "aarch64" || echo "x64")
          PKG="JSTorrent_${VERSION}_${ARCH}.pkg"
          xcrun notarytool submit "$PKG" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "${{ secrets.ASC_API_KEY_ID }}" \
            --issuer "${{ secrets.ASC_API_ISSUER_ID }}" \
            --wait
          xcrun stapler staple "$PKG"

      - name: Upload .pkg to release
        if: matrix.platform == 'macos-latest' && startsWith(github.ref, 'refs/tags/tauri-app-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#tauri-app-v}"
          TARGET="${{ matrix.rust_target }}"
          ARCH=$([[ "$TARGET" = "aarch64-apple-darwin" ]] && echo "aarch64" || echo "x64")
          gh release upload "tauri-app-v${VERSION}" "JSTorrent_${VERSION}_${ARCH}.pkg"

      # --- Cleanup ---
      - name: Clean up macOS keychain
        if: matrix.platform == 'macos-latest' && always()
        run: |
          security delete-keychain build.keychain 2>/dev/null || true
          rm -rf ~/private_keys 2>/dev/null || true

  # Clean up release assets after all builds complete
  finalize-release:
    if: startsWith(github.ref, 'refs/tags/tauri-app-v')
    needs: build-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Remove .sig files from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Delete all .sig files (signatures are embedded in latest.json)
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep '\.sig$' | while read -r name; do
            echo "Deleting $name"
            gh release delete-asset "$TAG" "$name" --yes
          done

      - name: Validate latest.json updater artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release download "$TAG" -p "latest.json" -D /tmp/ || {
            echo "::error::latest.json not found in release — auto-updates will not work for this version!"
            exit 1
          }
          python3 -c "
          import json, sys
          data = json.load(open('/tmp/latest.json'))
          assert 'version' in data, 'missing version field'
          assert 'platforms' in data, 'missing platforms field'
          platforms = data['platforms']
          assert len(platforms) > 0, 'no platforms in latest.json'
          for key, p in platforms.items():
              assert 'url' in p, f'{key}: missing url'
              assert 'signature' in p, f'{key}: missing signature'
              assert len(p['signature']) > 10, f'{key}: signature suspiciously short'
          print(f'latest.json valid: v{data[\"version\"]} with {len(platforms)} platform(s): {list(platforms.keys())}')
          "

      - name: Publish release checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          RELEASE_JSON="$(mktemp)"
          ASSET_DIR="$(mktemp -d)"
          CHECKSUMS_FILE="${ASSET_DIR}/SHA256SUMS"
          trap 'rm -f "$RELEASE_JSON"; rm -rf "$ASSET_DIR"' EXIT

          gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            > "$RELEASE_JSON"

          python3 - "$RELEASE_JSON" "$CHECKSUMS_FILE" <<'PY'
          import json
          import re
          import sys

          release_path, checksums_path = sys.argv[1:]
          with open(release_path, encoding="utf-8") as release_file:
              assets = json.load(release_file)["assets"]

          lines = []
          for asset in assets:
              name = asset["name"]
              if name == "SHA256SUMS":
                  continue
              digest = asset.get("digest", "")
              if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
                  raise SystemExit(f"{name}: missing or invalid SHA-256 digest")
              if any(character.isspace() for character in name):
                  raise SystemExit(f"{name!r}: whitespace is not supported in asset names")
              lines.append(f"{digest.removeprefix('sha256:')}  {name}")

          if not lines:
              raise SystemExit("no release assets were available for checksumming")

          with open(checksums_path, "w", encoding="utf-8") as checksums_file:
              checksums_file.write("\n".join(sorted(lines)) + "\n")
          PY

          gh release upload "$TAG" "$CHECKSUMS_FILE" --clobber

      - name: Update release body with download table
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#tauri-app-v}"
          REPO="${GITHUB_REPOSITORY}"
          BASE="https://github.com/${REPO}/releases/download/${TAG}"

          # Extract changelog
          CHANGELOG=$(awk "/^## \\[$VERSION\\]/{found=1; next} /^## \\[/{found=0} found" desktop/tauri-app/CHANGELOG.md)

          {
            if [ -n "$CHANGELOG" ]; then
              echo "$CHANGELOG"
              echo ""
            fi
            echo "## Download"
            echo ""
            echo "| Platform | |"
            echo "|----------|-|"
            echo "| macOS (Apple Silicon) | [.dmg](${BASE}/JSTorrent_${VERSION}_aarch64.dmg) · [.pkg](${BASE}/JSTorrent_${VERSION}_aarch64.pkg) |"
            echo "| macOS (Intel) | [.dmg](${BASE}/JSTorrent_${VERSION}_x64.dmg) · [.pkg](${BASE}/JSTorrent_${VERSION}_x64.pkg) |"
            echo "| Windows | [.exe](${BASE}/JSTorrent_${VERSION}_x64-setup.exe) · [.msi](${BASE}/JSTorrent_${VERSION}_x64_en-US.msi) |"
            echo "| Linux x86_64 | [.deb](${BASE}/JSTorrent_${VERSION}_amd64.deb) · [.AppImage](${BASE}/JSTorrent_${VERSION}_amd64.AppImage) · [.rpm](${BASE}/JSTorrent-${VERSION}-1.x86_64.rpm) |"
            echo "| Linux ARM64 | [.deb](${BASE}/JSTorrent_${VERSION}_arm64.deb) · [.AppImage](${BASE}/JSTorrent_${VERSION}_aarch64.AppImage) · [.rpm](${BASE}/JSTorrent-${VERSION}-1.aarch64.rpm) |"
            echo ""
            echo "### ChromeOS (Crostini)"
            echo ""
            echo 'For ChromeOS devices without Play Store, install the I/O daemon in the Linux container:'
            echo ""
            echo '```'
            echo 'curl -fsSL https://jstorrent.com/install-crostini.sh | bash'
            echo '```'
            echo ""
            echo "Standalone binaries: [x86_64](${BASE}/jstorrent-io-daemon-x86_64-unknown-linux-gnu) · [ARM64](${BASE}/jstorrent-io-daemon-aarch64-unknown-linux-gnu)"
            echo ""
            echo "[SHA-256 checksums](${BASE}/SHA256SUMS)"
          } > /tmp/release-body.md

          gh release edit "$TAG" --notes-file /tmp/release-body.md
