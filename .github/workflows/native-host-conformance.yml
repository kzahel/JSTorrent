name: Native Host Conformance

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'packages/engine/**'
      - 'contracts/**'
      - 'docs/contracts/**'
      - '.github/workflows/native-host-conformance.yml'
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'packages/engine/**'
      - 'contracts/**'
      - 'docs/contracts/**'
      - '.github/workflows/native-host-conformance.yml'

jobs:
  rust-native-host-conformance:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libgtk-3-dev

      - name: Run native-host conformance gate
        run: pnpm -C packages/engine run conformance:native-host
