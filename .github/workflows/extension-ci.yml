name: Extension CI

on:
  push:
    branches: [main]
    tags:
      - 'extension-v*'
    paths:
      - 'extension/**'
      - 'packages/**'
      - '.github/workflows/extension-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'extension/**'
      - 'packages/**'
      - '.github/workflows/extension-ci.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.16.0

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Build plugin-sdk
        run: pnpm build
        working-directory: packages/plugin-sdk

      - name: Build extension
        run: pnpm run build

      - name: Install system dependencies
        # rfd (file dialog) crate requires Wayland/GTK headers on Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libgtk-3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Native Host
        working-directory: desktop
        run: ./scripts/install-local-linux-sidecars.sh

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: '0.9.18'
          enable-cache: true

      - name: Install Python seeder dependencies
        working-directory: packages/engine/integration/python
        run: uv sync --locked

      - name: Start test seeder
        working-directory: packages/engine/integration/python
        run: |
          uv run python seed_for_test.py --size 100mb --quiet &
          sleep 2  # Give seeder a moment to bind

      - name: Run Playwright tests
        run: pnpm run test:e2e

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/extension-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: extension

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.16.0

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Build plugin-sdk
        run: pnpm build
        working-directory: packages/plugin-sdk

      - name: Build extension (with public key)
        run: pnpm run build

      - name: Package extension
        run: |
          cd dist
          zip -r ../jstorrent-extension.zip .

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#extension-v}" >> $GITHUB_OUTPUT

      - name: Extract changelog
        run: |
          VERSION="${GITHUB_REF_NAME#extension-v}"
          awk "/^## \\[$VERSION\\]/{found=1; next} /^## \\[/{found=0} found" CHANGELOG.md > /tmp/release-notes.md
          echo "Release notes for $VERSION:"
          cat /tmp/release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Extension v${{ steps.version.outputs.VERSION }}
          body_path: /tmp/release-notes.md
          files: extension/jstorrent-extension.zip
